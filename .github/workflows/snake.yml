# Gera o gráfico de contribuições "comido" por uma cobra, nas cores do portfólio.
# Roda 1x por dia (e manualmente) e publica os SVGs na branch "output".
name: snake

on:
  schedule:
    - cron: "0 9 * * *" # 06h em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#EE562F&color_dots=#1f1f1f,#4a2418,#7a3420,#b44628,#EE562F
            dist/snake-light.svg?color_snake=#EE562F&color_dots=#ebedf0,#f9d3c5,#f5a88c,#f17d55,#EE562F

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
