<svg xmlns="http://www.w3.org/2000/svg" width="840" height="40" viewBox="0 0 840 40" role="img" aria-label="activity"><title>activity</title><style>@font-face{font-family:PCMono;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:PCMonoB;src:url(data:font/woff2;base64,) format('woff2');}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes hide{to{opacity:0}}
@keyframes flash{from,to{opacity:1}}
.ln{transform-origin:120px 0;transform-box:view-box;animation:grow .9s cubic-bezier(.16,1,.3,1) .2s both;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><text x="0.0" y="24.0" font-family="PCMono" font-size="13" fill="#EE562F" text-anchor="start">//</text><text x="22.0" y="24.0" font-family="PCMonoB" font-size="13" fill="#191919" text-anchor="start" letter-spacing="2.4">ACTIVITY</text><rect class="ln" x="119.6" y="19.5" width="720.4" height="1" fill="#d0d7de"/></svg>