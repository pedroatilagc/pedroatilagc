<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-label="senderix-eval — CI for LLM quality"><title>senderix-eval — CI for LLM quality</title><style>@font-face{font-family:PCSerif;src:url(data:font/woff2;base64,) format('woff2');}
