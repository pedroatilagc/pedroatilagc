ht="22" rx="11" fill="#262626" stroke="#2E2E2E"/><text x="387.8" y="233.0" font-family="PCMono" font-size="11" fill="rgba(247,220,158,0.55)" text-anchor="start">Docker</text><rect x="500" y="40" width="308" height="180" rx="12" fill="#202020" stroke="#2E2E2E"/><text x="516.0" y="64.0" font-family="PCMono" font-size="11" fill="rgba(247,220,158,0.55)" text-anchor="start">pipeline.yml</text><g class="st0"><circle cx="526" cy="88" r="4" fill="none" stroke="#EE562F" stroke-width="1.5"/><line x1="526" y1="93" x2="526" y2="113" stroke="#2E2E2E" stroke-width="1.5"/><text x="542.0" y="92.0" font-family="PCMono" font-size="12" fill="#F7DC9E" text-anchor="start">golden dataset</text></g><text x="790.0" y="92.0" font-family="PCMono" font-size="12" fill="#7FBF8E" text-anchor="end" class="st0k">✓</text><g class="st1"><circle cx="526" cy="118" r="4" fill="none" stroke="#EE562F" stroke-width="1.5"/><line x1="526" y1="123" x2="526" y2="143" stroke="#2E2E2E" stroke-width="1.5"/><text x="542.0" y="122.0" font-family="PCMono" font-size="12" fill="#F7DC9E" text-anchor="start">run models</text></g><text x="790.0" y="122.0" font-family="PCMono" font-size="12" fill="#7FBF8E" text-anchor="end" class="st1k">✓</text><g class="st2"><circle cx="526" cy="148" r="4" fill="none" stroke="#EE562F" stroke-width="1.5"/><line x1="526" y1="153" x2="526" y2="173" stroke="#2E2E2E" stroke-width="1.5"/><text x="542.0" y="152.0" font-family="PCMono" font-size="12" fill="#F7DC9E" text-anchor="start">LLM-as-a-judge</text></g><text x="790.0" y="152.0" font-family="PCMono" font-size="12" fill="#7FBF8E" text-anchor="end" class="st2k">✓</text><g class="st3"><circle cx="526" cy="178" r="4" fill="none" stroke="#EE562F" stroke-width="1.5"/><text x="542.0" y="182.0" font-family="PCMono" font-size="12" fill="#F7DC9E" text-anchor="start">regression gate</text></g><text x="790.0" y="182.0" font-family="PCMono" font-size="12" fill="#EE562F" text-anchor="end" class="st3k">pass</text><circle class="pulse" cx="526" cy="88" r